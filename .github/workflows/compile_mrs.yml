name: Auto Compile Meta MRS

on:
  push:
    paths:
      - 'rules/domain/**'
      - 'rules/ip/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download and Extract Mihomo Tool
        run: |
          echo "==== 开始使用 jq 严谨解析 Mihomo 下载链接 ===="
          
          # 🌟 绝杀修改：通过官方 jq 工具，精准提取符合 linux-amd64 条件的 browser_download_url
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.assets[] | select(.name | contains("linux-amd64") and endswith(".gz")) | .browser_download_url' \
            | head -n 1)
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "❌ 错误：未能获取到有效的下载直链！"
            exit 1
          fi
          
          echo "捕获到的真实内核下载直链: $DOWNLOAD_URL"
          
          # 下载真正的二进制压缩包
          wget -O mihomo.gz "$DOWNLOAD_URL"
          
          # 解压并赋权
          gunzip mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Process and Compile Rules
        run: |
          mkdir -p rules/mrs
          echo "==== 开始扫描并编译规则 ===="
          
          # 1. 处理域名文件夹
          if [ -d "rules/domain" ] && [ "$(ls -A rules/domain/*.yaml 2>/dev/null)" ]; then
            for file in rules/domain/*.yaml; do
              filename=$(basename "$file" .yaml)
              echo "正在编译域名规则: $file -> rules/mrs/${filename}.mrs"
              ./mihomo predict rule-set compile domain "$file" "rules/mrs/${filename}.mrs"
            done
          fi

          # 2. 处理 IP 文件夹
          if [ -d "rules/ip" ] && [ "$(ls -A rules/ip/*.yaml 2>/dev/null)" ]; then
            for file in rules/ip/*.yaml; do
              filename=$(basename "$file" .yaml)
              echo "正在编译 IP 规则: $file -> rules/mrs/${filename}_ip.mrs"
              ./mihomo predict rule-set compile ipcidr "$file" "rules/mrs/${filename}_ip.mrs"
            done
          fi
          
          echo "==== 编译流程顺利结束 ===="

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add rules/mrs/*.mrs
          
          if git diff --staged --quiet; then
            echo "没有检测到生成的 .mrs 文件有任何变动，跳过推送。"
          else
            git commit -m "action: 自动编译最新的 Domain & IP 二进制规则集 (终修复)"
            git push
          fi
