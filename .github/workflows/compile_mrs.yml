name: Auto Compile Meta MRS

on:
  push:
    paths:
      - 'rules/domain/**'
      - 'rules/ip/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download and Extract Mihomo Tool
        run: |
          echo "==== 开始动态获取 Mihomo 正确的 .gz 下载链接 ===="
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "browser_download_url" | grep "linux-amd64-v" | grep "\.gz" | head -n 1 | cut -d '"' -f 4)
          wget -O mihomo.gz "$DOWNLOAD_URL"
          gunzip mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Process and Compile Rules
        run: |
          mkdir -p rules/mrs
          echo "==== 开始扫描并编译规则 ===="
          
          # 1. 处理域名文件夹
          if [ -d "rules/domain" ] && [ "$(ls -A rules/domain/*.yaml 2>/dev/null)" ]; then
            for file in rules/domain/*.yaml; do
              filename=$(basename "$file" .yaml)
              echo "正在编译域名规则: $file -> rules/mrs/${filename}.mrs"
              
              # 🌟 核心修复：调整参数顺序，并使用 timeout 5 确保哪怕它脑抽启动了，5秒内也必须强制断开并往下走
              timeout 5 ./mihomo rule-set compile domain "$file" "rules/mrs/${filename}.mrs" || true
            done
          fi

          # 2. 处理 IP 文件夹
          if [ -d "rules/ip" ] && [ "$(ls -A rules/ip/*.yaml 2>/dev/null)" ]; then
            for file in rules/ip/*.yaml; do
              filename=$(basename "$file" .yaml)
              echo "正在编译 IP 规则: $file -> rules/mrs/${filename}_ip.mrs"
              
              # 🌟 核心修复：调整参数顺序并加超时强杀
              timeout 5 ./mihomo rule-set compile ipcidr "$file" "rules/mrs/${filename}_ip.mrs" || true
            done
          fi
          
          echo "==== 编译流程顺利结束 ===="

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add rules/mrs/*.mrs 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "没有检测到生成的 .mrs 文件有任何变动，跳过推送。"
          else
            git commit -m "action: 自动编译最新的 Domain & IP 二进制规则集"
            git push
          fi
