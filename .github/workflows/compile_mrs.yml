name: Auto Compile Meta MRS

on:
  push:
    paths:
      - 'rules/domain/**'
      - 'rules/ip/**'
  workflow_dispatch: # 支持手动触发

# 🌟 核心修复：提前声明强制所有生态 Action 使用最新的 Node.js 24 运行
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # 获取最近两次提交以对比变化

      - name: Download Mihomo Tool
        run: |
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.18.3/mihomo-linux-amd64-v1.18.3.tar.gz
          tar -zxf mihomo-linux-amd64-v1.18.3.tar.gz
          mv mihomo-linux-amd64 mihomo
          chmod +x mihomo

      - name: Process and Compile Rules
        run: |
          # 创建输出目录（防万一）
          mkdir -p rules/mrs
          
          echo "==== 开始扫描并编译规则 ===="
          
          # 1. 处理域名文件夹 (rules/domain/*.yaml)
          if [ -d "rules/domain" ]; then
            for file in rules/domain/*.yaml; do
              [ -e "$file" ] || continue
              filename=$(basename "$file" .yaml)
              echo "发现域名规则: $file -> 编译为 rules/mrs/${filename}.mrs"
              ./mihomo rule-set compile --type domain "$file" "rules/mrs/${filename}.mrs"
            done
          fi

          # 2. 处理 IP 文件夹 (rules/ip/*.yaml)
          # 会自动将 behavior 设置为 ipcidr，并为文件名追加 _ip 后缀
          if [ -d "rules/ip" ]; then
            for file in rules/ip/*.yaml; do
              [ -e "$file" ] || continue
              filename=$(basename "$file" .yaml)
              echo "发现 IP 规则: $file -> 编译为 rules/mrs/${filename}_ip.mrs"
              ./mihomo rule-set compile --type ipcidr "$file" "rules/mrs/${filename}_ip.mrs"
            done
          fi
          
          echo "==== 编译流程结束 ===="

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add rules/mrs/*.mrs
          
          # 检查是否有文件变动，防止空提交报错
          if git diff --staged --quiet; then
            echo "没有检测到生成的 .mrs 文件有任何变动，跳过推送。"
          else
            git commit -m "action: 自动编译最新的 Domain & IP 二进制规则集 (Node24)"
            git push
          fi
