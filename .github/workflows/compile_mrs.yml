- name: Process and Compile Rules
        run: |
          mkdir -p rules/mrs
          echo "==== 开始扫描并编译规则 ===="
          
          # 绝对路径绑定：确保存储与读取路径完全一致
          CONFIG_PATH="$(pwd)/dummy_config.yaml"
          
          # 强行将所有监听端口设为 0，彻底封印本地网络引擎
          cat << 'EOF' > "$CONFIG_PATH"
          mode: rule
          log-level: warning
          allow-lan: false
          external-controller: ""
          dns:
            enable: false
          tun:
            enable: false
          mixed-port: 0
          port: 0
          socks-port: 0
          redir-port: 0
          tproxy-port: 0
          EOF
          
          # 1. 处理域名文件夹
          if [ -d "rules/domain" ] && [ "$(ls -A rules/domain/*.yaml 2>/dev/null)" ]; then
            for file in rules/domain/*.yaml; do
              filename=$(basename "$file" .yaml)
              echo "正在编译域名规则: $file -> rules/mrs/${filename}.mrs"
              
              # 🌟 修复：将 -c 改为 Mihomo 专属的 -f 参数
              ./mihomo -f "$CONFIG_PATH" rule-set compile domain "$(pwd)/$file" "$(pwd)/rules/mrs/${filename}.mrs"
            done
          fi

          # 2. 处理 IP 文件夹
          if [ -d "rules/ip" ] && [ "$(ls -A rules/ip/*.yaml 2>/dev/null)" ]; then
            for file in rules/ip/*.yaml; do
              filename=$(basename "$file" .yaml)
              echo "正在编译 IP 规则: $file -> rules/mrs/${filename}_ip.mrs"
              
              # 🌟 修复：将 -c 改为 Mihomo 专属的 -f 参数
              ./mihomo -f "$CONFIG_PATH" rule-set compile ipcidr "$(pwd)/$file" "$(pwd)/rules/mrs/${filename}_ip.mrs"
            done
          fi
          
          echo "==== 编译流程顺利结束 ===="
