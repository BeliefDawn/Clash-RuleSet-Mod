name: Auto Compile Meta MRS

on:
  push:
    paths:
      - 'rules/domain/**'
      - 'rules/ip/**'
  workflow_dispatch: # 支持手动触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download and Extract Mihomo Tool
        run: |
          echo "==== 开始动态获取 Mihomo 正确的 .gz 下载链接 ===="
          
          # 从官方 API 获取最新版本的真实下载直链 (精准匹配 linux-amd64-v 开头且以 .gz 结尾的文件)
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "browser_download_url" | grep "linux-amd64-v" | grep "\.gz" | head -n 1 | cut -d '"' -f 4)
          
          echo "捕获到的真实下载链接: $DOWNLOAD_URL"
          
          # 下载并保存为 mihomo.gz
          wget -O mihomo.gz "$DOWNLOAD_URL"
          
          # 🌟 核心修复：官方是 .gz 单文件压缩，使用 gunzip 解压
          gunzip mihomo.gz
          
          # 给解压出来的二进制文件赋予执行权限
          chmod +x mihomo
          
          # 验证工具是否能正常运行
          ./mihomo -v
          echo "==== Mihomo 编译工具安全就绪 ===="

      - name: Process and Compile Rules
        run: |
          mkdir -p rules/mrs
          echo "==== 开始扫描并编译规则 ===="
          
          # 1. 处理域名文件夹
          if [ -d "rules/domain" ] && [ "$(ls -A rules/domain/*.yaml 2>/dev/null)" ]; then
            for file in rules/domain/*.yaml; do
              filename=$(basename "$file" .yaml)
              echo "正在编译域名规则: $file -> rules/mrs/${filename}.mrs"
              if ! ./mihomo rule-set compile --type domain "$file" "rules/mrs/${filename}.mrs"; then
                echo "❌ 错误: 编译 $file 失败！"
                exit 8
              fi
            done
          else
            echo "ℹ️ 提示: rules/domain 文件夹为空，跳过。"
          fi

          # 2. 处理 IP 文件夹
          if [ -d "rules/ip" ] && [ "$(ls -A rules/ip/*.yaml 2>/dev/null)" ]; then
            for file in rules/ip/*.yaml; do
              filename=$(basename "$file" .yaml)
              echo "正在编译 IP 规则: $file -> rules/mrs/${filename}_ip.mrs"
              if ! ./mihomo rule-set compile --type ipcidr "$file" "rules/mrs/${filename}_ip.mrs"; then
                echo "❌ 错误: 编译 $file 失败！"
                exit 8
              fi
            done
          else
            echo "ℹ️ 提示: rules/ip 文件夹为空，跳过。"
          fi
          
          echo "==== 编译流程顺利结束 ===="

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 尝试添加生成的 mrs 文件
          git add rules/mrs/*.mrs 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "没有检测到生成的 .mrs 文件有任何变动，跳过推送。"
          else
            git commit -m "action: 自动编译最新的 Domain & IP 二进制规则集"
            git push
          fi